<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/assets/kalbe-logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kalbe Microsite</title>

    <script>
      (function () {
        var newDomain = "https://kalbe.qyubit.com"; // ganti dengan domain baru kamu

        // Ambil path (contoh: /booth-checkin) dan query param (contoh: ?booth_id=123)
        var targetUrl = newDomain + window.location.pathname + window.location.search;

        // Langsung lempar ke domain baru
        window.location.replace(targetUrl);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
